# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2

updates:
  # Package versions are centralized in /Directory.Packages.props, which this entry updates for every project.
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Denver"
    ignore:
      # These reach other projects through the library's floors; bumping them adds a pin that breaks the newer frameworks.
      - dependency-name: "Microsoft.AspNetCore.Components.Authorization"
      - dependency-name: "Microsoft.AspNetCore.Components.WebAssembly"
      # Must move with the SkiaSharp version in the Charts submodule, which Dependabot does not update here.
      - dependency-name: "SkiaSharp.NativeAssets.Linux.NoDependencies"
    exclude-paths:
      # The library pins its published ASP.NET Core dependency floors with VersionOverride, raised only for security
      # fixes; submodules own their dependencies.
      - "NTComponents/NTComponents.csproj"
      - "Submodules/**"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "chore"
      include: "scope"
