# yaml-language-server: $schema=https://json.schemastore.org/dependabot-2.0.json
version: 2

updates:
  - package-ecosystem: "nuget"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Denver"
    ignore:
      - dependency-name: "Microsoft.AspNetCore.Components.WebAssembly"
    exclude-paths:
      # The library has its own package policy below; submodules own their dependencies.
      - "NTComponents/NTComponents.csproj"
      - "Submodules/**"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "nuget"
    directory: "/NTComponents"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "America/Denver"
    ignore:
      - dependency-name: "Microsoft.AspNetCore.Components.WebAssembly"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "tuesday"
      time: "06:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "wednesday"
      time: "06:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "dotnet-sdk"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "thursday"
      time: "06:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "chore"
      include: "scope"

  - package-ecosystem: "gitsubmodule"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "friday"
      time: "06:00"
      timezone: "America/Denver"
    commit-message:
      prefix: "chore"
      include: "scope"
